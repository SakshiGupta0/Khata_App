name: Build Android APKs

on:
  push:
    branches: [android-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [khata, hisaab]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Assemble web assets (offline libs + fonts)
        run: node ../../scripts/build-www.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Icons, splash, signing, version
        run: python3 ../../scripts/patch-android.py ${{ matrix.app }}
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.keystore
            echo "KS_PASS=$KS_PASS_SECRET" >> "$GITHUB_ENV"
            echo "Using the stable family signing key."
          else
            P=$(openssl rand -hex 12)
            keytool -genkeypair -keystore android/app/release.keystore -alias key -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Khata Hisaab temporary build"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE secrets set - built with a TEMPORARY key. Add KEYSTORE_B64 and KEYSTORE_PASS secrets for a stable key."
          fi
      - name: Build release APK
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          KS_FILE: ${{ github.workspace }}/apps/${{ matrix.app }}/android/app/release.keystore
          KS_ALIAS: key
      - name: Name the APK
        run: |
          mkdir -p ../../out
          cp android/app/build/outputs/apk/release/app-release.apk ../../out/${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: out/${{ matrix.app }}.apk

  publish:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - name: Push APKs to the apks branch
        run: |
          mkdir apks && cp dl/*.apk apks/ && cd apks
          printf "Build %s\n" "${{ github.run_number }}" > BUILD.txt
          git init -q -b apks
          git config user.name "build-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "APKs from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apks
